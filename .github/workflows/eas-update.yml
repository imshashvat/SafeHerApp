name: 🚀 EAS Update — OTA Push

# ──────────────────────────────────────────────────────────────────────────────
# Trigger: any push to the `main` branch.
# What it does:
#   1. Installs dependencies
#   2. Runs `eas update` → pushes the new JS bundle to Expo's CDN
#   3. Users get the update silently on their NEXT app launch (no reinstall needed)
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'      # Only trigger when mobile code changes

jobs:
  eas-update:
    name: Publish OTA Update
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js (matches local dev environment)
      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      # 3. Install npm dependencies (fast, uses lockfile)
      - name: 📦 Install dependencies
        run: npm ci
        working-directory: mobile

      # 4. Setup EAS CLI with your Expo account token
      #    → Add EXPO_TOKEN as a GitHub secret (see README below)
      - name: 🔧 Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # 5. Push OTA update to the `preview` branch
      - name: 🚀 Publish OTA Update
        env:
          EXPO_PUBLIC_FAST2SMS_KEY: ${{ secrets.FAST2SMS_KEY }}
          EXPO_PUBLIC_EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          EXPO_PUBLIC_EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          EXPO_PUBLIC_EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
        run: |
          eas update \
            --branch preview \
            --message "${{ github.event.head_commit.message }}" \
            --non-interactive
        working-directory: mobile

      # 6. Print success summary
      - name: ✅ Update published!
        run: |
          echo "OTA update pushed to branch: production"
          echo "Commit: ${{ github.event.head_commit.message }}"
          echo "Users will receive this update on next app launch."
